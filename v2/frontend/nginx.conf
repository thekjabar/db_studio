# Web container: serves the SPA at the site root and proxies /api → the Rust backend.
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://qs-v2-api:3010/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Long-running work lives behind /api: pg_dump backups (can be GBs and take
    # many minutes) and big schema introspection. Stream it straight to the
    # client — buffering a multi-GB dump would fill the container's disk/memory.
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_buffering off;
    proxy_request_buffering off;
    # Plain-SQL dumps are highly compressible text — gzipping on the fly cuts a
    # multi-hundred-MB download by roughly 5-10x, which is the dominant cost over
    # the internet. The browser decompresses transparently, so the saved .sql is
    # unchanged. Level 1 keeps CPU cost near zero on this small box and still
    # gets most of the ratio on SQL. Custom-format dumps (-Fc) are ALREADY
    # compressed, so they are deliberately not listed here.
    gzip on;
    gzip_types application/sql;
    gzip_proxied any;
    gzip_comp_level 1;
    # The refresh cookie (dbdash_rt) is scoped to /api/auth by v1, but the Rust
    # strangler-proxy still rewrites it to /v2/api (main.rs). The browser is at
    # /api now, so map it back down — otherwise the cookie is never sent and
    # token refresh fails.
    proxy_cookie_path /v2/api/ /api/;
    proxy_cookie_path /v2/api /api;
  }

  # Realtime. socket.io's own transport (polling upgrade + websocket) — buffering
  # OFF or frames get corrupted in transit ("Invalid frame header").
  location /socket.io/ {
    proxy_pass http://qs-v2-api:3010;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  # Desktop-agent tunnel. Raw WebSocket (not socket.io) straight to the Rust
  # backend. Long timeouts: the socket is held open for the agent's lifetime,
  # and it only exchanges traffic when someone queries an agent-routed database.
  location /agent-ws {
    proxy_pass http://qs-v2-api:3010;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  # Old /v2/* links (bookmarks, indexed URLs) → same path at the root.
  location = /v2 { return 301 /; }
  location /v2/ { rewrite ^/v2/(.*)$ /$1 permanent; }

  # Hashed build output — the filename changes whenever the bytes do, so these
  # can be cached hard and for a long time. `immutable` stops the browser even
  # revalidating them.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # index.html must NEVER be cached.
  #
  # It is the only file that names which hashed chunk to load, so a cached copy
  # pins the browser to a build that no longer exists on disk. That is exactly
  # what happened after a deploy: the origin served the new bundle, while
  # browsers and Cloudflare went on loading a deleted chunk from cache and
  # login died with ERR_CONNECTION_REFUSED against an API address that had
  # since been corrected. A deploy is not deployed until the entry point stops
  # being cached.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
