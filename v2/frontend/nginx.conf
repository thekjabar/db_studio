# Web container: serves the SPA at the site root and proxies /api → the Rust backend.
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://qs-v2-api:3010/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
    # The refresh cookie (dbdash_rt) is scoped to /api/auth by v1, but the Rust
    # strangler-proxy still rewrites it to /v2/api (main.rs). The browser is at
    # /api now, so map it back down — otherwise the cookie is never sent and
    # token refresh fails.
    proxy_cookie_path /v2/api/ /api/;
    proxy_cookie_path /v2/api /api;
  }

  # Old /v2/* links (bookmarks, indexed URLs) → same path at the root.
  location = /v2 { return 301 /; }
  location /v2/ { rewrite ^/v2/(.*)$ /$1 permanent; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
