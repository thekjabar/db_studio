[package]
name = "queryschema-v2"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "queryschema-v2"
path = "src/main.rs"

[dependencies]
# ws: the agent tunnel gateway. multipart: CSV import upload.
axum = { version = "0.7", features = ["ws", "multipart"] }
# Reserved for BullMQ-compatible queue writes. NOT yet used: reproducing
# bullmq's repeatable-job entries needs a cron parser + msgpack + its versioned
# Lua scripts, and a malformed entry stalls the scheduler for everyone rather
# than failing loudly, so schedule mutations still proxy to v1.
# (Agent presence is NOT in Redis — it is an in-process map; the Rust tunnel
# now owns that instead, see tunnel::is_online.)
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager"] }
# v1 classifies SQL with an AST parse (node-sql-parser) to decide read-only vs
# mutating, and transpiles between dialects. A keyword heuristic disagrees
# exactly on the stacked-statement / CTE-hiding-a-write cases that gate exists
# for, so a real parser is required.
sqlparser = "0.52"
# Realtime: the frontend speaks socket.io (namespace /realtime), so a plain
# WebSocket won't do — this serves the actual socket.io/engine.io protocol.
socketioxide = "0.15"
# BullMQ repeatable jobs: cron -> next-run millis in the schedule's timezone,
# and msgpack for the three packed ARGV slots its Lua scripts expect.
cron = "0.12"
chrono-tz = "0.10"
rmp-serde = "1.3"
# TOTP (2FA): HMAC-SHA1 over a base32 secret, plus the QR for enrolment.
sha1 = "0.10"
base32 = "0.5"
qrcode = { version = "0.14", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process"] }
# Bridges pg_dump's stdout (AsyncRead) to an axum response body (Stream) so a
# multi-GB backup streams instead of buffering.
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
# Runtime query API only (no `query!` macro) so this compiles without a live DB.
# No TLS backend â†’ no `ring`/C-compiler dependency (app DB is reached over the
# docker network without TLS; target-DB TLS can be added later behind a feature).
sqlx = { version = "0.7", default-features = false, features = [
  "runtime-tokio",
  "postgres",
  "json",
  "chrono",
] }
serde = { version = "1", features = ["derive"] }
# preserve_order keeps JSON object key order = the SQL column order from to_jsonb.
serde_json = { version = "1", features = ["preserve_order"] }
# Pure-Rust HS256 JWT (avoids jsonwebtoken â†’ ring â†’ C compiler).
hmac = "0.12"
sha2 = "0.10"
argon2 = "0.5"
# Replicates v1's envelope encryption (crypto.service.ts + local-key.provider.ts)
# so v2 can decrypt stored connection credentials and reach the target databases.
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
# Strangler proxy: unported endpoints forward to the v1 Node API over the
# docker network (http, no TLS â†’ no ring).
# rustls-tls is REQUIRED, not optional: without a TLS backend every https://
# request fails, which silently breaks outbound mail (Resend), webhook delivery
# to customer endpoints, and the export integrations. Proxying to v1 is plain
# http over the docker network, which is why this went unnoticed.
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
# Lighter release build so the RAM-tight prod box (or a `-j1` build) survives.
opt-level = 2
lto = false
codegen-units = 16
